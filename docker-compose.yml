# Local MySQL for development: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gnt
      MYSQL_USER: gnt
      MYSQL_PASSWORD: gnt_local_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - gnt_mysql:/var/lib/mysql

volumes:
  gnt_mysql:
