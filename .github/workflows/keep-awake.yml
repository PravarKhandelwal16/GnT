# Render's free plan puts the API to sleep after 15 minutes without visitors, and waking it
# takes about a minute. This pings it every 10 minutes so visitors don't wait.
# One always-on free service uses ~744 of Render's 750 free hours a month.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          curl --silent --show-error --fail --retry 4 --retry-delay 20 --retry-all-errors \
               --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
               "https://giveandtake-api-0fko.onrender.com/api/products?size=1"
