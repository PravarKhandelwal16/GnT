spring:
  config:
    # Local secrets live in backend/.env (git-ignored). See backend/.env.example.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gnt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    encoding: UTF-8

  servlet:
    multipart:
      # Matches the limits enforced in MediaRules (5 images at 5 MB + 1 video at 50 MB).
      max-file-size: 50MB
      max-request-size: 80MB

  data:
    web:
      pageable:
        max-page-size: 100

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-* from the reverse proxy / platform load balancer (HTTPS).
  forward-headers-strategy: framework

springdoc:
  api-docs:
    # Swagger UI at /swagger-ui.html. Off by default so production does not publish the API map.
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

application:
  jwt:
    # No default on purpose: the app refuses to start without a private secret.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Comma-separated emails that become owners on sign-up (existing accounts are promoted at startup).
  owner-emails: ${OWNER_EMAILS:}
  mail:
    from: ${MAIL_FROM:no-reply@giveandtake.local}
  sample-data:
    # Lists 8 starter products from two sample sellers on startup (never duplicates them).
    enabled: ${SAMPLE_DATA:true}
    # Optional: lets you log in as the sample sellers. Without it nobody can.
    seller-password: ${SAMPLE_SELLER_PASSWORD:}
  exchange:
    # Time the buyer and seller have to meet after a reservation.
    reservation-hours: ${EXCHANGE_RESERVATION_HOURS:48}
  listing:
    # Guards against minting credits with inflated, auto-approved listings.
    max-credit-value: ${LISTING_MAX_CREDIT_VALUE:5000}
    max-active-per-user: ${LISTING_MAX_ACTIVE_PER_USER:25}
  media:
    # Used only when no ImageKit key is configured.
    local-dir: ${MEDIA_LOCAL_DIR:uploads}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY:}
  private-key: ${IMAGEKIT_PRIVATE_KEY:}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}
